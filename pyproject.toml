[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-readiness-agent"
version = "0.1.0"
description = "A policy-gated agent that audits repositories for portfolio and production readiness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Logan Norton" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
repo-ready = "readiness_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=readiness_agent --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

